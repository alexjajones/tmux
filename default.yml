name: default
root: <%= @settings["workspace"] %>
attach: True

startup_pane: 1

windows:
  - editor: >
      if test -f "build.sbt"; 
      then
        jenv shell 17
        nvim .
      elif test -f "pyproject.toml"; 
      then
        poetry run nvim .
      else
        nvim .
      fi
  - term: date
